[package]
name = "krep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kRep core: pseudonymous reputation attestations anchored on Kaspa"

[dependencies]
secp256k1 = { version = "0.29", features = ["rand"] }
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"
