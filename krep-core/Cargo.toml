[package]
name = "krep-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "kRep core: pseudonymous reputation attestations anchored on Kaspa"

[features]
default = []
# Live anchor verification against a kaspad node. Off by default so the
# offline attestation/chain logic builds without the rusty-kaspa tree.
kaspad = ["dep:kaspa-rpc-core", "dep:kaspa-txscript", "dep:tokio"]

[dependencies]
secp256k1 = { version = "0.29", features = ["rand"] }
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rand = "0.8"

# Poseidon2, via Noir's own BN254 solver pinned to the installed nargo. Shared
# with krep-zk so the sponge exists once: attestation ids and the accumulators
# must hash identically or a circuit cannot recompute an id from its body.
bn254_blackbox_solver = "1.0.0-beta.26"
acir_field = "1.0.0-beta.26"

# rusty-kaspa workspace crates (feature `kaspad`).
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1", optional = true }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }

[dev-dependencies]
# Live-node tests only (see tests/live_anchor.rs, gated on $KREP_TEST_RPC).
kaspa-grpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
