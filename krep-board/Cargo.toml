[package]
name = "krep-board"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FabMesh job board (kRep M3): Nostr event formats and relay I/O"

[dependencies]
krep-core = { path = "../krep-core" }
krep-escrow = { path = "../krep-escrow" }
secp256k1 = { version = "0.29", features = ["rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"

# sha2 for NIP-01 event ids, via the rusty-kaspa crate that re-exports it.
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
# Already compiled in the tree via the wRPC stack; promoted to a direct dep.
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
futures-util = "0.3"
