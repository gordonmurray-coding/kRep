[package]
name = "krep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krep"
path = "src/main.rs"

[dependencies]
krep-core = { path = "../krep-core" }
secp256k1 = { version = "0.29", features = ["rand"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rand = "0.8"
