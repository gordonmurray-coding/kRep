[package]
name = "krep-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "krep"
path = "src/main.rs"

[dependencies]
krep-core = { path = "../krep-core", features = ["kaspad"] }
secp256k1 = { version = "0.29", features = ["rand"] }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"
rand = "0.8"

# rusty-kaspa workspace crates. secp256k1 is pinned to 0.29 upstream too, so
# `Keypair` is the same type on both sides — no key conversion needed.
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-grpc-client = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", tag = "v2.0.1" }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
krep-escrow = { path = "../krep-escrow" }
krep-board = { path = "../krep-board" }
serde = { version = "1", features = ["derive"] }
